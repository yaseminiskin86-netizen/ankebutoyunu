<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Örümceğin Bilgi Ağı – Ankebut Suresi 41. Ayet | Kur'an-ı Kerim 6. Sınıf</title>
<meta name="description" content="Kur'an-ı Kerim 6. sınıf KK.6.3.3 öğrenme çıktısı için eğitici oyun: Ankebut suresinin 41. ayetiyle ilgili bilgi toplama.">
<style>
/* =========================================================
   1. TASARIM DEĞİŞKENLERİ (renk, boşluk, font, ölçü)
   ========================================================= */
:root{
  --wood:#8a5a2b; --wood-dark:#5b3a1b; --wood-light:#c08a55;
  --parchment:#fbf3de; --parchment-2:#f2e2bb; --parchment-edge:#e2c994;
  --ink:#352617; --ink-soft:#5a4631;
  --leaf:#2e6b5a; --leaf-light:#dcebe3; --berry:#c8401c;
  --ok:#23702a; --ok-bg:#e2f2dc; --ok-border:#4d9b52;
  --err:#a8261d; --err-bg:#fbe4df; --err-border:#d0665b;
  --info:#1c5b93; --info-bg:#e1eefa; --info-border:#6a9fd0;
  --sel:#1c5b93; --sel-bg:#dcebfa;
  --gold:#d99a0f; --sky-1:#cfe6f5; --sky-2:#eef6fa;
  --radius:18px; --radius-sm:12px; --radius-pill:999px;
  --gap:clamp(8px,1.1vw,20px);
  --shadow:0 6px 18px rgba(60,35,10,.18);
  --focus:0 0 0 4px #fff, 0 0 0 8px #1c5b93;
  --font-ui:"Nunito","Trebuchet MS","Segoe UI",Tahoma,Arial,sans-serif;
  --font-ar:"ShaikhHamdullahBasic","Amiri","Scheherazade New","Noto Naskh Arabic","Traditional Arabic","Arabic Typesetting","Times New Roman",serif;
  --fs-base:clamp(16px,.55vw + 10.5px,22px);
  --btn-min:clamp(48px,3.4vw,68px);
}
*{box-sizing:border-box}
html{font-size:var(--fs-base)}
body{
  margin:0; min-height:100vh; color:var(--ink); font-family:var(--font-ui); line-height:1.5;
  background:#eaf4f8 linear-gradient(180deg,var(--sky-1) 0%,var(--sky-2) 55%,#efe4c6 100%) fixed;
  overflow-x:hidden;
}
img{max-width:100%}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed}
:focus{outline:none}
:focus-visible{box-shadow:var(--focus)!important; border-radius:12px; outline:3px solid transparent}
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.skip-link{position:absolute;left:8px;top:-60px;background:#fff;color:var(--info);padding:10px 16px;border-radius:10px;z-index:1000;font-weight:700}
.skip-link:focus{top:8px}
[hidden]{display:none!important}

/* =========================================================
   2. ORTAK BİLEŞENLER (parşömen panel, butonlar)
   ========================================================= */
.parchment{
  background:radial-gradient(ellipse at 30% 20%,#fffaf0 0%,var(--parchment) 45%,var(--parchment-2) 100%);
  border:clamp(6px,.6vw,10px) solid var(--wood);
  border-radius:var(--radius);
  box-shadow:inset 0 0 0 3px var(--wood-light), inset 0 0 30px rgba(150,100,40,.18), var(--shadow);
}
.btn{
  min-height:var(--btn-min); padding:.55em 1.3em; border-radius:var(--radius-pill);
  border:3px solid var(--wood-dark); background:linear-gradient(#fff8e8,#f0dcae);
  font-weight:800; font-size:1rem; color:var(--ink); display:inline-flex; align-items:center; justify-content:center; gap:.5em;
  box-shadow:0 4px 0 var(--wood-dark); transition:transform .12s, box-shadow .12s;
  text-decoration:none;
}
.btn:hover:not(:disabled){transform:translateY(-2px)}
.btn:active:not(:disabled){transform:translateY(2px); box-shadow:0 1px 0 var(--wood-dark)}
.btn:disabled{opacity:.5}
.btn-primary{background:linear-gradient(#ffd98a,#f2a93b); border-color:#8a4f10; box-shadow:0 4px 0 #8a4f10}
.btn-leaf{background:linear-gradient(#e6f4ec,#b9dcc8); border-color:var(--leaf); box-shadow:0 4px 0 var(--leaf)}
.btn-small{min-height:44px; font-size:.9rem; padding:.35em 1em}
.btn .ico{width:1.5em;height:1.5em;object-fit:contain}

/* Görsel butonlar (tasarım setindeki yuvarlak butonlar) */
.img-btn{
  background:none; border:0; padding:0; display:inline-flex; flex-direction:column; align-items:center;
  width:clamp(92px,7.2vw,138px); transition:transform .12s, filter .12s; border-radius:20px;
}
.img-btn img{width:100%; height:auto; display:block; pointer-events:none; filter:drop-shadow(0 4px 6px rgba(60,35,10,.25))}
.img-btn:hover:not(:disabled){transform:translateY(-3px) scale(1.03)}
.img-btn:active:not(:disabled){transform:scale(.97)}
.img-btn:disabled{filter:grayscale(.9); opacity:.45}
.icon-btn{background:none;border:0;padding:0;width:var(--btn-min);height:var(--btn-min);border-radius:50%}
.icon-btn img{width:100%;height:100%;object-fit:contain;display:block;pointer-events:none}

/* =========================================================
   3. GİRİŞ EKRANI
   ========================================================= */
#screen-login{min-height:100vh; display:grid; grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr); gap:var(--gap); padding:clamp(12px,2vw,40px); align-items:center}
.login-card{padding:clamp(18px,2.4vw,48px); max-width:900px; justify-self:center; width:100%}
.login-card .badge{display:inline-block; background:var(--leaf); color:#fff; padding:.2em .9em; border-radius:var(--radius-pill); font-weight:800; font-size:.85rem; letter-spacing:.02em}
.login-card h1{font-size:clamp(1.9rem,3.2vw,3.6rem); line-height:1.1; margin:.35em 0 .1em; color:var(--wood-dark)}
.login-card .sub{font-size:clamp(1.05rem,1.4vw,1.6rem); margin:0 0 .8em; color:var(--leaf); font-weight:800}
.howto{background:rgba(255,255,255,.55); border:2px dashed var(--wood-light); border-radius:var(--radius-sm); padding:.6em 1em .6em 2.2em; margin:0 0 1em}
.howto li{margin:.25em 0}
.name-row{display:flex; flex-wrap:wrap; gap:12px; align-items:flex-end}
.name-row label{font-weight:800; display:block; margin-bottom:.3em}
.name-field{flex:1 1 260px}
.name-field input{width:100%; min-height:var(--btn-min); border:3px solid var(--wood); border-radius:14px; padding:.4em .8em; background:#fffdf6; font-size:1.1rem}
.field-error{color:var(--err); font-weight:800; min-height:1.5em; margin:.3em 0 0}
.login-art{position:relative; align-self:stretch; min-height:320px; border-radius:var(--radius); overflow:hidden; box-shadow:var(--shadow); border:8px solid var(--wood)}
.login-art > img.bg{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position:60% 30%}
.spider-row{position:absolute; left:0; right:0; bottom:4%; display:flex; justify-content:center; gap:1%; padding:0 3%}
.spider-row img{width:18%; filter:drop-shadow(0 6px 6px rgba(0,0,0,.3)); animation:bob 3s ease-in-out infinite}
.spider-row img:nth-child(2){animation-delay:.3s}.spider-row img:nth-child(3){animation-delay:.6s}
.spider-row img:nth-child(4){animation-delay:.9s}.spider-row img:nth-child(5){animation-delay:1.2s}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.login-tools{display:flex; gap:10px; margin-top:1em; align-items:center; flex-wrap:wrap; font-size:.9rem; color:var(--ink-soft)}

/* =========================================================
   4. OYUN EKRANI – ÜST BİLGİ ÇUBUĞU (HUD)
   ========================================================= */
#screen-game{min-height:100vh; display:flex; flex-direction:column}
.hud{
  display:flex; flex-wrap:wrap; align-items:center; gap:clamp(6px,.8vw,16px);
  padding:clamp(6px,.6vw,12px) clamp(10px,1.2vw,24px);
  background:linear-gradient(#9b6a37,#7a4e24); border-bottom:5px solid var(--wood-dark); color:#fff8e6;
  box-shadow:0 4px 12px rgba(0,0,0,.2);
}
.hud-title{font-weight:900; font-size:clamp(1rem,1.25vw,1.5rem); margin:0; flex:1 1 220px; line-height:1.2}
.hud-title small{display:block; font-weight:700; opacity:.9; font-size:.72em}
.pill{display:inline-flex; align-items:center; gap:.45em; background:var(--parchment); color:var(--ink); border:3px solid var(--wood-dark);
  border-radius:var(--radius-pill); padding:.2em .9em; font-weight:900; min-height:48px; font-size:clamp(.95rem,1.1vw,1.35rem)}
.pill .star{color:var(--gold); font-size:1.3em; line-height:1}
.hearts{letter-spacing:.08em; color:var(--berry); font-size:1.25em; line-height:1}
.hearts .empty{color:#a89a88}
.hud-tools{display:flex; gap:8px; align-items:center; flex-wrap:wrap}
.cap-btn{min-height:48px; padding:.2em .8em; border-radius:12px; border:3px solid var(--wood-dark); background:var(--parchment); font-weight:800; font-size:.85rem}
.cap-btn[aria-pressed="true"]{background:#fff0c2}

/* İlerleme: ağ ipinde yürüyen örümcek */
.thread-progress{flex:1 1 100%; order:5; display:flex; align-items:center; gap:10px; padding:4px 2px 0}
.thread{position:relative; flex:1; height:16px; background:repeating-linear-gradient(90deg,#f7ecd2 0 10px,#efe0bb 10px 20px); border:3px solid var(--wood-dark); border-radius:99px}
.thread-fill{position:absolute; left:0; top:0; bottom:0; background:linear-gradient(#e46a3d,#c8401c); border-radius:99px; width:0; transition:width .5s}
.thread-spider{position:absolute; top:50%; width:clamp(34px,2.6vw,50px); transform:translate(-50%,-60%); transition:left .5s; left:0; pointer-events:none}
.thread-label{font-weight:800; font-size:.85rem; white-space:nowrap}

/* =========================================================
   5. OYUN EKRANI – YERLEŞİM
   ========================================================= */
.layout{flex:1; display:grid; grid-template-columns:minmax(260px,25%) minmax(0,1fr); gap:var(--gap); padding:var(--gap); align-items:start}

/* Sol: Bilgi Ağacı (senaryodaki ağaç yapısı) */
.tree-panel{padding:clamp(10px,1vw,18px); position:sticky; top:var(--gap)}
.tree-panel h2{margin:0 0 .4em; font-size:1.15rem; color:var(--wood-dark); display:flex; align-items:center; gap:.4em}
.tree-band{position:relative; border-radius:14px; overflow:hidden; border:4px solid var(--wood); aspect-ratio:1200/560; background:#b9dcf2}
.tree-band > img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover}
.web-spot{position:absolute; width:13%; aspect-ratio:1; transform:translate(-50%,-50%); border-radius:50%}
.web-spot.current{box-shadow:0 0 0 3px #fff, 0 0 14px 6px rgba(255,210,90,.95); animation:glow 1.8s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 0 3px #fff,0 0 22px 10px rgba(255,210,90,.6)}}
.web-spot .num{position:absolute; top:-28%; left:50%; transform:translateX(-50%); background:var(--berry); color:#fff; font-weight:900; font-size:clamp(.6rem,.7vw,.85rem); width:1.7em; height:1.7em; border-radius:50%; display:grid; place-items:center; border:2px solid #fff}
.web-spot .sp{position:absolute; left:50%; top:45%; width:95%; transform:translate(-50%,-50%); filter:drop-shadow(0 3px 3px rgba(0,0,0,.35))}
.web-spot .sp.drop{animation:drop .9s cubic-bezier(.3,1.4,.5,1)}
@keyframes drop{0%{transform:translate(-50%,-260%)}100%{transform:translate(-50%,-50%)}}
.stage-list{list-style:none; margin:.8em 0 0; padding:0; display:flex; flex-direction:column; gap:6px}
.stage-list li{display:flex; align-items:center; gap:.6em; padding:.35em .5em; border-radius:12px; border:2px solid transparent; font-weight:700; color:#8c7c68}
.stage-list li img{width:2.3em; height:auto; flex:0 0 auto}
.stage-list li .st{font-size:.78rem; display:block; font-weight:800}
.stage-list li.done{color:var(--ink)}
.stage-list li.done .st{color:var(--ok)}
.stage-list li[aria-current="step"]{background:#fff5d6; border-color:var(--gold); color:var(--ink)}
.stage-list li[aria-current="step"] .st{color:var(--wood)}
.stage-list button.link{all:unset; cursor:pointer; flex:1; border-radius:8px}
.stage-list button.link:focus-visible{box-shadow:var(--focus)}

/* Sağ: görev paneli */
.stage-panel{padding:clamp(14px,1.6vw,32px); min-height:60vh; display:flex; flex-direction:column; gap:var(--gap); position:relative}
.stage-head{display:flex; align-items:center; gap:.6em; flex-wrap:wrap}
.stage-head .tag{background:var(--leaf); color:#fff; font-weight:800; padding:.15em .8em; border-radius:99px; font-size:.85rem}
.stage-head h2{margin:0; font-size:clamp(1.3rem,1.8vw,2.2rem); color:var(--wood-dark)}
.stage-head .webmini{width:clamp(44px,3.4vw,64px)}
.guide{display:flex; align-items:flex-end; gap:clamp(8px,1vw,16px)}
.guide img{width:clamp(76px,7vw,130px); flex:0 0 auto; filter:drop-shadow(0 5px 5px rgba(0,0,0,.25))}
.bubble{position:relative; background:#fff; border:3px solid var(--wood); border-radius:20px; padding:.7em 1em; font-size:1.05rem; font-weight:700; flex:1; box-shadow:var(--shadow)}
.bubble::before{content:""; position:absolute; left:-16px; bottom:18px; border:8px solid transparent; border-right:14px solid var(--wood)}
.bubble::after{content:""; position:absolute; left:-9px; bottom:20px; border:6px solid transparent; border-right:10px solid #fff}
.bubble .who{display:block; font-size:.8rem; color:var(--leaf); font-weight:900}
.listen{margin-left:.4em; vertical-align:middle}

.task{display:flex; flex-direction:column; gap:var(--gap)}
.task h3{margin:0; font-size:clamp(1.15rem,1.55vw,1.9rem); line-height:1.35}
.task h3:focus-visible{box-shadow:var(--focus)}
.step-count{font-weight:800; color:var(--ink-soft); font-size:.9rem}

/* Bilgi kartı */
.info-card{background:rgba(255,255,255,.6); border:3px solid var(--wood-light); border-radius:var(--radius); padding:clamp(12px,1.2vw,24px)}
.info-card ul{margin:.3em 0; padding-left:1.3em}
.info-card li{margin:.35em 0; font-size:1.05rem}
.think{background:#fff5d6; border-left:8px solid var(--gold); padding:.7em 1em; border-radius:10px; font-weight:700}

/* Arapça metin alanı (RTL, geniş satır aralığı) */
.ayah{background:#fffdf5; border:3px double var(--wood); border-radius:var(--radius); padding:clamp(12px,1.4vw,28px)}
.ayah .ar{font-family:var(--font-ar); direction:rtl; text-align:center; font-size:clamp(1.6rem,2.6vw,3.2rem); line-height:2.3; padding:.2em .3em .4em; overflow-wrap:break-word; color:#1f1409; margin:0}
.ayah .meal{font-size:1.1rem; font-weight:700; text-align:center; margin:.4em 0 0}
.ayah .ref{display:block; text-align:center; color:var(--ink-soft); font-weight:800; font-size:.9rem; margin-top:.3em}
.ayah .tools{display:flex; flex-wrap:wrap; gap:10px; justify-content:center; margin-top:.8em}
.media-msg{color:#7a4800; font-weight:700; text-align:center; min-height:1.2em; margin:.4em 0 0}

/* Çoktan seçmeli seçenekler (tasarım setindeki A-B-C-D şeritleri) */
.options{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:clamp(10px,1.2vw,22px)}
.opt{
  display:flex; align-items:center; gap:.7em; text-align:left; min-height:clamp(60px,5vw,92px);
  padding:.45em 1em .45em .5em; border-radius:var(--radius-pill); border:3px solid #cdb68c;
  background:linear-gradient(#fffaf0,#f4e8cd); font-weight:800; font-size:clamp(1rem,1.15vw,1.4rem);
  box-shadow:0 4px 0 #cdb68c; transition:transform .12s;
}
.opt:hover:not(:disabled){transform:translateY(-2px)}
.opt .letter{flex:0 0 auto; width:2.1em; height:2.1em; border-radius:50%; display:grid; place-items:center; color:#fff; font-weight:900; border:3px solid #fff; box-shadow:0 2px 3px rgba(0,0,0,.25)}
.opt:nth-child(4n+1) .letter{background:#d4452b}.opt:nth-child(4n+2) .letter{background:#2b83c6}
.opt:nth-child(4n+3) .letter{background:#3f9a45}.opt:nth-child(4n+4) .letter{background:#e0a912}
.opt .txt{flex:1}
.opt .state{font-size:.8rem; font-weight:900; white-space:nowrap}
.opt.selected{border-color:var(--sel); background:var(--sel-bg); box-shadow:0 4px 0 var(--sel)}
.opt.correct{border-color:var(--ok-border); background:var(--ok-bg); box-shadow:0 4px 0 var(--ok)}
.opt.correct .state{color:var(--ok)}
.opt.wrong{border-color:var(--err-border); background:var(--err-bg); box-shadow:0 4px 0 var(--err)}
.opt.wrong .state{color:var(--err)}
.opt:disabled:not(.correct):not(.wrong){opacity:.6}

/* Doğru / Yanlış */
.statement{font-size:clamp(1.15rem,1.6vw,2rem); font-weight:800; line-height:1.45; padding:clamp(14px,1.4vw,28px); background:#fffdf5; border:3px solid var(--wood-light); border-radius:var(--radius)}
.tf-row{display:flex; flex-wrap:wrap; gap:clamp(12px,1.4vw,26px); align-items:center}
.tf-btn{flex:1 1 200px; min-height:clamp(66px,5.5vw,100px); font-size:clamp(1.1rem,1.4vw,1.7rem)}
.tf-btn img{width:1.8em;height:1.8em}
.tf-btn.correct{background:var(--ok-bg); border-color:var(--ok); box-shadow:0 4px 0 var(--ok)}
.tf-btn.wrong{background:var(--err-bg); border-color:var(--err); box-shadow:0 4px 0 var(--err)}
.research{display:flex; align-items:center; gap:.8em; flex-wrap:wrap; background:var(--info-bg); border:2px solid var(--info-border); border-radius:14px; padding:.5em .9em; font-size:.95rem}
.research a.btn{background:linear-gradient(#eaf4ff,#c7def6); border-color:var(--info); box-shadow:0 4px 0 var(--info); color:#0f3c66}

/* Çoklu seçim kartları */
.cards{display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr)); gap:clamp(10px,1vw,18px)}
.card-btn{min-height:clamp(70px,5.5vw,100px); border-radius:18px; border:3px solid #cdb68c; background:#fffaf0; font-weight:800; text-align:left; padding:.6em .9em; display:flex; gap:.6em; align-items:center; box-shadow:0 4px 0 #cdb68c; font-size:clamp(.98rem,1.05vw,1.25rem)}
.card-btn .box{flex:0 0 auto; width:1.6em;height:1.6em;border:3px solid var(--wood); border-radius:8px; display:grid; place-items:center; background:#fff; font-weight:900}
.card-btn[aria-pressed="true"]{border-color:var(--sel); background:var(--sel-bg); box-shadow:0 4px 0 var(--sel)}
.card-btn[aria-pressed="true"] .box::after{content:"✓"; color:var(--sel)}
.card-btn.correct{border-color:var(--ok); background:var(--ok-bg)}
.card-btn.correct .box::after{content:"✓"; color:var(--ok)}
.card-btn.missed{border-style:dashed; border-color:var(--ok)}

/* Eşleştirme ve kayıt (seç → yerleştir) */
.match{display:grid; grid-template-columns:1fr 1fr; gap:clamp(12px,2vw,40px)}
.match .col{display:flex; flex-direction:column; gap:12px}
.match .col h4{margin:0; font-size:1rem; color:var(--ink-soft)}
.m-item{min-height:clamp(64px,5vw,96px); border-radius:16px; border:3px solid #cdb68c; background:#fffaf0; font-weight:800; text-align:left; padding:.5em .9em; box-shadow:0 4px 0 #cdb68c; font-size:clamp(.98rem,1.1vw,1.3rem)}
.m-item[aria-pressed="true"]{border-color:var(--sel); background:var(--sel-bg); box-shadow:0 4px 0 var(--sel)}
.m-item.paired{border-color:var(--ok); background:var(--ok-bg); box-shadow:0 4px 0 var(--ok)}
.m-item.paired::before{content:"✓ Eşleşti: "; color:var(--ok); font-size:.8em}
.m-item.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.record{display:grid; grid-template-columns:minmax(0,1.3fr) minmax(0,1fr); gap:clamp(12px,1.6vw,32px); align-items:start}
.record-sheet{background:#fffdf5; border:3px solid var(--wood); border-radius:var(--radius); padding:clamp(10px,1vw,20px); background-image:repeating-linear-gradient(#fffdf5 0 38px,#eadcbc 38px 40px)}
.record-sheet h4{margin:0 0 .5em; font-size:1.15rem; color:var(--wood-dark)}
.slot-row{display:grid; grid-template-columns:minmax(120px,38%) 1fr; gap:10px; align-items:center; margin:8px 0}
.slot-row .lbl{font-weight:900; font-size:.95rem}
.slot{min-height:clamp(54px,4vw,72px); border:3px dashed #b39b6f; border-radius:14px; background:rgba(255,255,255,.8); text-align:left; padding:.35em .7em; font-weight:800; font-size:clamp(.92rem,1vw,1.2rem)}
.slot.filled{border-style:solid; border-color:var(--sel); background:var(--sel-bg)}
.slot.correct{border-style:solid; border-color:var(--ok); background:var(--ok-bg)}
.slot .ph{color:#8c7c68; font-weight:700}
.pool{display:flex; flex-direction:column; gap:10px}
.pool h4{margin:0; font-size:1rem}
.chip{min-height:clamp(52px,3.8vw,68px); border-radius:14px; border:3px solid #cdb68c; background:#fffaf0; font-weight:800; text-align:left; padding:.4em .8em; box-shadow:0 3px 0 #cdb68c; font-size:clamp(.92rem,1vw,1.2rem)}
.chip[aria-pressed="true"]{border-color:var(--sel); background:var(--sel-bg); box-shadow:0 3px 0 var(--sel)}

/* Yorumlayalım */
.reflect label{font-weight:900; display:block; margin:.6em 0 .2em}
.reflect textarea{width:100%; min-height:90px; border:3px solid var(--wood); border-radius:14px; padding:.6em .8em; background:#fffdf6; font-size:1.05rem; resize:vertical}
.quote{font-size:1.2rem; font-weight:800; text-align:center; color:var(--leaf); margin:0}
.quote small{display:block; color:var(--ink-soft); font-size:.8em}

/* Geri bildirim kutusu */
.feedback{border-radius:var(--radius); padding:.8em 1em; display:flex; gap:.9em; align-items:flex-start; font-size:1.05rem; border:3px solid}
.feedback:empty{display:none}
.feedback img{width:clamp(48px,3.6vw,70px); flex:0 0 auto}
.feedback .fb-alert-icon{width:clamp(48px,3.6vw,70px);height:clamp(48px,3.6vw,70px);flex:0 0 auto;border-radius:50%;display:grid;place-items:center;background:linear-gradient(#ffd85f,#f6aa16);border:3px solid #9b5d12;box-shadow:0 3px 0 rgba(105,59,12,.28), inset 0 2px 5px rgba(255,255,255,.75);color:#5a3100;font-weight:1000;font-size:clamp(30px,2.6vw,48px);line-height:1;font-family:Arial,Helvetica,sans-serif}
.feedback .fb-title{font-weight:900; font-size:1.15em; display:block}
.feedback.ok{background:var(--ok-bg); border-color:var(--ok-border)}
.feedback.err{background:var(--err-bg); border-color:var(--err-border)}
.feedback.hint{background:#fff6d8; border-color:var(--gold)}
.feedback.info{background:var(--info-bg); border-color:var(--info-border)}
.feedback .pts{display:inline-block; background:#fff; border:2px solid var(--gold); border-radius:99px; padding:0 .6em; font-weight:900; margin-left:.3em}

.actions{display:flex; justify-content:space-between; align-items:flex-end; gap:12px; flex-wrap:wrap; margin-top:auto}
.actions .right{margin-left:auto; display:flex; gap:12px; align-items:flex-end; flex-wrap:wrap}

/* Boyama (Esmâ-i Hüsnâ ağı) */
.color-wrap{display:grid; grid-template-columns:minmax(0,1fr) minmax(180px,260px); gap:var(--gap); align-items:start}
.color-wrap svg{width:100%; max-width:620px; height:auto; display:block; margin:auto; background:#fffdf5; border-radius:50%; border:4px solid var(--wood)}
.color-wrap svg .cell{stroke:#6b4a2a; stroke-width:1.5; cursor:pointer}
.color-wrap svg .cell:focus-visible{stroke:#1c5b93; stroke-width:5}
.color-wrap svg text{font-family:var(--font-ui); font-weight:800; pointer-events:none; fill:#3b2a1a}
.palette{display:flex; flex-wrap:wrap; gap:10px}
.swatch{width:52px;height:52px;border-radius:50%;border:4px solid #fff; box-shadow:0 0 0 2px var(--wood)}
.swatch[aria-pressed="true"]{box-shadow:0 0 0 4px var(--ink)}

/* Öz değerlendirme */
.self-table{width:100%; border-collapse:separate; border-spacing:0 10px}
.self-table th{text-align:left; font-size:.9rem; color:var(--ink-soft)}
.self-table td{background:#fffdf5; padding:.6em .8em; border-top:2px solid #e1cfa6; border-bottom:2px solid #e1cfa6; vertical-align:middle}
.self-table td:first-child{border-left:2px solid #e1cfa6; border-radius:12px 0 0 12px; font-weight:800}
.self-table td:last-child{border-right:2px solid #e1cfa6; border-radius:0 12px 12px 0}
.yn{display:flex; gap:8px; flex-wrap:wrap}
.yn button[aria-pressed="true"]{background:var(--sel-bg); border-color:var(--sel)}
.self-msg{font-weight:800; margin-top:.3em; font-size:.9rem}

/* Altyazı çubuğu */
.caption-bar{position:sticky; bottom:0; background:rgba(33,24,14,.92); color:#fff; padding:.55em 1.2em; font-size:clamp(1rem,1.2vw,1.45rem); font-weight:700; text-align:center; min-height:2.6em}
.caption-bar:empty{display:none}

/* =========================================================
   6. MODAL (bölüm tamamlandı, onay, bilgi)
   ========================================================= */
.modal-backdrop{position:fixed; inset:0; background:rgba(30,20,10,.55); display:grid; place-items:center; z-index:500; padding:16px}
.modal{width:min(640px,100%); max-height:92vh; overflow:auto; padding:clamp(16px,2vw,34px); position:relative; text-align:center}
.modal h2{margin:.2em 0; color:var(--wood-dark); font-size:clamp(1.4rem,2vw,2.3rem)}

.modal .celebrate{display:flex; justify-content:center; align-items:center; gap:4%; margin:.4em 0}
.modal .celebrate img.web{width:30%; max-width:170px}
.modal .celebrate img.sp{width:28%; max-width:160px}
.modal .btns{display:flex; gap:12px; justify-content:center; flex-wrap:wrap; margin-top:1em}
.modal .info-card{text-align:left}
.stars{font-size:2rem; color:var(--gold); letter-spacing:.1em}

/* =========================================================
   7. SONUÇ EKRANI
   ========================================================= */
#screen-result{min-height:100vh; padding:clamp(12px,2vw,40px); display:flex; flex-direction:column; gap:var(--gap)}
.result-grid{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:var(--gap)}
.result-card{padding:clamp(16px,1.8vw,36px)}

.stats{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin:0}
.stats div{background:#fffdf5; border:2px solid #e1cfa6; border-radius:14px; padding:.6em .8em}
.stats dt{font-size:.85rem; font-weight:800; color:var(--ink-soft)}
.stats dd{margin:0; font-size:1.5rem; font-weight:900}
.learned li{margin:.4em 0; font-size:1.05rem}
.result-actions{display:flex; flex-wrap:wrap; gap:14px; justify-content:center; align-items:flex-end}
.web-trophy{display:flex; justify-content:center; gap:2%; margin:.5em 0}
.web-trophy figure{margin:0; width:18%; text-align:center; font-size:.75rem; font-weight:800}
.web-trophy figure img{width:100%}

/* =========================================================
   8. YAZDIRMA ALANI (sertifika, araştırma kaydı, boyama)
   ========================================================= */
#print-area{display:none}
.cert{width:100%; aspect-ratio:297/210; padding:5%; border:14px solid var(--wood); outline:4px solid var(--wood-dark); outline-offset:-26px;
  background:radial-gradient(ellipse at center,#fffaf0 0%,#f6e9c9 100%); text-align:center; display:flex; flex-direction:column; justify-content:center; gap:.6em; color:var(--ink); position:relative}

.cert p{font-size:1.1rem; margin:.2em 8%}
.cert .meta{display:flex; justify-content:space-around; font-weight:800; margin-top:.8em}
.cert .spiders{display:flex; justify-content:center; gap:2%; margin-top:.6em}
.cert .spiders img{width:9%}
.sheet{padding:10mm; color:#000}
.sheet h1{font-size:20pt; margin:0 0 4mm}
.sheet table{width:100%; border-collapse:collapse; margin:4mm 0}
.sheet th,.sheet td{border:1px solid #555; padding:3mm; text-align:left; vertical-align:top; font-size:12pt}
.sheet th{width:35%; background:#f1e7cf}
.sheet .ar{font-family:var(--font-ar); direction:rtl; font-size:20pt; line-height:2.2; text-align:center}

@media print{
  @page{size:A4 landscape; margin:8mm}
  body{background:#fff!important}
  body > *:not(#print-area){display:none!important}
  #print-area{display:block!important}
  @page portraitA4{size:A4 portrait; margin:12mm}
  #print-area .sheet{page:portraitA4; page-break-inside:avoid}
  .cert{height:190mm; width:auto; aspect-ratio:auto; -webkit-print-color-adjust:exact; print-color-adjust:exact}
  .color-print svg{width:170mm; height:170mm; display:block; margin:auto}
}

/* =========================================================

}

  *,*::before,*::after{animation:none!important; transition:none!important; scroll-behavior:auto!important}
}

@keyframes cameraEntry{0%{transform:scale(1.02) translate3d(7.5%,-5.5%,0);filter:saturate(.92) brightness(.98)}38%{transform:scale(1.08) translate3d(2.5%,-2.5%,0)}72%{transform:scale(1.19) translate3d(-3.5%,1.2%,0)}100%{transform:scale(1.30) translate3d(-7.2%,3.4%,0);filter:saturate(1.07) brightness(1.02)}}

.scene-leaves{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;pointer-events:none;z-index:1;will-change:transform}

/* =========================================================

const $ = (sel, root = document) => root.querySelector(sel);

/** Güvenli DOM oluşturucu: metinler daima textContent ile eklenir. */
function el(tag, attrs = {}, ...children) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === null || v === undefined || v === false) continue;
    if (k === "class") node.className = v;
    else if (k === "text") node.textContent = v;
    else if (k.startsWith("on") && typeof v === "function") node.addEventListener(k.slice(2), v);
    else node.setAttribute(k, v === true ? "" : v);
  }
  for (const c of children.flat()) {
    if (c === null || c === undefined || c === false) continue;
    node.append(c instanceof Node ? c : document.createTextNode(String(c)));
  }
  return node;
}

/** Fisher–Yates karıştırma (kopya döndürür). */
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/** Metindeki {ad} yer tutucusunu öğrencinin adıyla değiştirir (sonuç yine textContent ile kullanılır). */
function personalize(text) { return String(text || "").replace(/\{ad\}/g, state ? state.student.first : ""); }

function img(key, extra = {}) {
  const m = CONFIG.media.images[key];
  const node = el("img", Object.assign({ src: m.src, alt: m.decorative ? "" : m.alt }, extra));
  node.addEventListener("error", () => { console.warn("[Medya Hatası] " + m.src + " yüklenemedi."); node.style.visibility = "hidden"; }, { once: true });
  return node;
}
function webImg(level, extra = {}) { return img("web" + Math.max(0, Math.min(4, level)), extra); }
function spiderImg(key, view = "front", extra = {}) {
  const s = CONFIG.media.spiders[key];
  const node = el("img", Object.assign({ src: s[view] || s.front, alt: "" }, extra));
  node.addEventListener("error", () => { console.warn("[Medya Hatası] " + (s[view] || s.front) + " yüklenemedi."); node.style.visibility = "hidden"; }, { once: true });
  return node;
}

/** Görsel buton (tasarım setindeki yuvarlak etiketli butonlar). */
function imgButton(key, label, onClick, extra = {}) {

/** İsim temizleme: fazla boşluklar ve kontrol karakterleri kaldırılır. */
function cleanName(raw) {
  return String(raw || "").replace(/[\u0000-\u001F\u007F<>]/g, "").replace(/\s+/g, " ").trim().slice(0, 60);
}

/* =========================================================
   5) SES SİSTEMİ (efekt ve isteğe bağlı tilavet; seslendirme kaldırıldı)
   ========================================================= */
const Sound = {
  ctx: null,
  recitation: null,     // çalan tilavet
  voice: null,
  init() { this.voice = null; },
  /** V5: Seslendirme kaldırıldı. Metin yalnızca erişilebilir canlı bölgede duyurulur. */
  say(text) {
    const t = personalize(text);
    announce(t);
  },
  stopSpeech() {},
  /** Kısa, yumuşak efekt sesleri (Web Audio). Tilavet sırasında çalmaz. */
  effect(kind) {
    if (!state || !state.audioOn || !CONFIG.audio.effects || this.recitation) return;
    try {
      this.ctx = this.ctx || new (window.AudioContext || window.webkitAudioContext)();
      const notes = { correct: [660, 880], wrong: [330], complete: [523, 659, 784, 1047], click: [520] }[kind] || [440];
      const t0 = this.ctx.currentTime;
      notes.forEach((f, i) => {
        const o = this.ctx.createOscillator(), g = this.ctx.createGain();
        o.type = "sine"; o.frequency.value = f;
        const st = t0 + i * 0.12;
        g.gain.setValueAtTime(0, st);
        g.gain.linearRampToValueAtTime(CONFIG.audio.effectVolume, st + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, st + 0.35);
        o.connect(g).connect(this.ctx.destination); o.start(st); o.stop(st + 0.4);
      });
    } catch (e) { /* ses desteklenmiyor – sessiz devam */ }
  },
  /** Tilavet: efektsiz, hızlandırmasız, olduğu gibi çalınır. */
  playRecitation(key, msgNode, btn) {
    const m = CONFIG.media.audio[key];
    if (!m) return;
    if (this.recitation) { this.stopRecitation(); return; }
    if (!state.audioOn) { msgNode.textContent = "Ses kapalı. Dinlemek için üstteki ses butonuyla sesi açınız."; return; }
    this.stopSpeech();
    const a = new Audio(m.src);
    a.playbackRate = 1;
    this.recitation = a;
    btn.setAttribute("aria-pressed", "true");
    btn.lastChild.textContent = "Durdur";
    msgNode.textContent = "Tilavet dinleniyor…";
    const done = (errMsg) => {
      this.recitation = null;
      btn.setAttribute("aria-pressed", "false");
      btn.lastChild.textContent = "";
      msgNode.textContent = errMsg || "";
    };
    a.addEventListener("ended", () => done(""));
    a.addEventListener("error", () => {
      console.warn("[Medya Hatası] " + m.src + " yüklenemedi.");
      done("Ses dosyası kullanılamıyor. Metinsel içerikle devam edebilirsiniz.");
    });
    const p = a.play();
    if (p && p.catch) p.catch(() => done("Ses dosyası kullanılamıyor. Metinsel içerikle devam edebilirsiniz."));
  },
  stopRecitation() {
    if (this.recitation) { try { this.recitation.pause(); } catch (e) {} this.recitation.dispatchEvent(new Event("ended")); }
  }
};

function focusFirst(container) {

/* =========================================================
   7) SKOR VE HAK SİSTEMİ (tek merkez)
   ========================================================= */
function maxTriesFor(type) { return type === "tf" ? CONFIG.tries.trueFalse : CONFIG.tries.default; }
/** Deneme numarasına göre puan (1. deneme = 100 ...). */
function pointsFor(type, attemptNo) {
  const table = type === "tf" ? CONFIG.scoring.trueFalse : CONFIG.scoring.default;
  return table[attemptNo] || 0;
}
function scoredSteps() {
  const list = [];
  STAGES.forEach(s => s.steps.forEach(st => { if (isScored(st)) list.push(st.id); }));
  return list;
}
function isScored(step) { return ["mcq", "tf", "multi", "match", "record"].includes(step.type); }
function maxScore() {
  let m = 0;
  STAGES.forEach(s => s.steps.forEach(st => { if (isScored(st)) m += pointsFor(st.type, 1); }));
  return m;
}
/** Görev sonucu kaydedilir; tekrar oynamada puan değişmez. */
function recordResult(step, correct, attempts, wrongAttempts) {
  if (state.replay !== null) return 0;
  if (state.results[step.id]) return 0;
  const pts = correct ? pointsFor(step.type, attempts) : 0;
  state.results[step.id] = { correct, attempts, points: pts, wrongAttempts };
  state.score += pts;
  updateHud();
  return pts;
}
/** Başarı yüzdesi = doğru tamamlanan görev / toplam puanlı görev × 100 */
function successPercent() {
  const total = scoredSteps().length;
  const ok = Object.values(state.results).filter(r => r.correct).length;
  return total ? Math.round(ok / total * 100) : 0;
}
function totalWrongAttempts() { return Object.values(state.results).reduce((s, r) => s + (r.wrongAttempts || 0), 0); }

/* =========================================================
   8) ARAYÜZ – HUD, Bilgi Ağacı
   ========================================================= */
function updateHud() {
  $("#hud-score-num").textContent = String(state.score);
  $("#hud-score").setAttribute("aria-label", "Puan: " + state.score);
  // Haklar
  const t = state.task;
  const hearts = $("#hud-hearts"); hearts.textContent = "";
  if (t && t.maxTries) {
    const left = Math.max(0, t.maxTries - t.wrong);
    for (let i = 0; i < t.maxTries; i++) hearts.append(el("span", { class: i < left ? "" : "empty", text: i < left ? "♥" : "♡" }));
    $("#hud-tries-sr").textContent = "Kalan hak: " + left + " / " + t.maxTries;
    $("#hud-tries").hidden = false;
  } else {
    $("#hud-tries").hidden = true;
  }
  // İlerleme
  const total = scoredSteps().length;
  const done = Object.keys(state.results).length;
  const pct = total ? Math.round(done / total * 100) : 0;
  $("#thread-fill").style.width = pct + "%";
  $("#thread-spider").style.left = pct + "%";
  $("#thread-label").textContent = done + " / " + total + " görev";
  const pb = $("#progressbar");
  pb.setAttribute("aria-valuenow", String(pct));
  pb.setAttribute("aria-valuetext", done + " / " + total + " görev tamamlandı, yüzde " + pct);
  const stage = currentStage();
  if (stage) $("#thread-spider").src = CONFIG.media.spiders[stage.guide].right;
}

function stageWebLevel(stageIdx) {
  if (state.completedStages.includes(stageIdx)) return 4;
  const st = STAGES[stageIdx];
  const ids = st.steps.filter(isScored).map(s => s.id);
  const done = ids.filter(id => state.results[id]).length;
  return ids.length ? Math.floor(done / ids.length * 4) : 0;
}

function renderTree(dropIdx = -1) {

    } else {

    }
    list.append(li);
  });
  // Değerlendirme ve sonuç adımları
  const extra = [["6. Ağ: Ağı Renklendir", "color"], ["Değerlendirelim", "self"], ["Etkinliği Tamamla", "end"]];
  extra.forEach(([t, k]) => {

    const label = el("span", {}, t, el("span", { class: "st", text: cur ? "Şu an buradasın" : done ? "Tamamlandı ✓" : colorUnlocked ? "Hazır • Açmak için seç" : (k === "color" ? "Kilitli" : "") }));

/* =========================================================
   SİNEMATİK SAHNE / ÖRÜMCEK HAREKETLERİ
   ========================================================= */
const WORLD_WEB_POS = [
  { x: 23.9, y: 31.2 }, { x: 28.2, y: 31.2 }, { x: 32.5, y: 31.2 }, { x: 36.8, y: 31.2 }, { x: 41.1, y: 31.2 }
];
const SPIDER_TARGET_Y = 70.5;
const QUESTIONS_PER_STAGE = 5;
function setCameraForStage(idx) {
  const cam = $("#scene-camera");
  if (!cam) return;
  const safeIdx = Math.max(0, Math.min(4, idx));
  cam.className = "scene-camera cam-" + safeIdx;
  const game = $("#screen-game");
  if (game) game.dataset.stage = String(safeIdx);
}
function scoredProgressInStage(idx) {
  const stage = state && state.stages ? state.stages[idx] : STAGES[idx];
  if (!stage) return { done: 0, total: QUESTIONS_PER_STAGE };
  const scored = stage.steps.filter(isScored).slice(0, QUESTIONS_PER_STAGE);
  const done = scored.filter(st => state.results[st.id] && state.results[st.id].correct).length;
  return { done, total: QUESTIONS_PER_STAGE };
}
function updateStageDots(idx) {
  const box = $("#stage-step-dots"); if (!box) return;
  const prog = scoredProgressInStage(idx); box.textContent = "";
  for (let i=0;i<QUESTIONS_PER_STAGE;i++) {
    const d = el("span", { "aria-hidden":"true", class: (i < prog.done ? "done" : "") + (i === prog.done && prog.done < QUESTIONS_PER_STAGE ? " current" : "") });
    box.append(d);
  }
  box.setAttribute("aria-label", "Bu bölümde " + prog.done + " / 5 doğru cevapla iniş tamamlandı");
}
function setSilk(idx, done) {
  const pos = WORLD_WEB_POS[idx];
  const line = $("#drop-silk-line");
  if (!line) return;
  const endY = spiderY(idx, done);
  line.classList.remove("casting");
  line.setAttribute("x1", String(pos.x));
  line.setAttribute("x2", String(pos.x));
  line.setAttribute("y1", String(pos.y));
  line.setAttribute("y2", String(endY));
  line.style.opacity = done > 0 ? "1" : "0";
  line.style.strokeDashoffset = done > 0 ? "0" : "1";
}
function castSilkToStep(idx, nextDone) {
  const pos = WORLD_WEB_POS[idx];
  const line = $("#drop-silk-line");
  if (!line) return;
  const endY = spiderY(idx, nextDone);
  line.classList.remove("casting");
  line.setAttribute("x1", String(pos.x));
  line.setAttribute("x2", String(pos.x));
  line.setAttribute("y1", String(pos.y));
  line.setAttribute("y2", String(endY));
  line.style.opacity = "1";
  line.style.strokeDashoffset = "1";
  void line.getBoundingClientRect();
  line.classList.add("casting");
  requestAnimationFrame(() => { line.style.strokeDashoffset = "0"; });
}
function spiderY(idx, done) {
  const y0 = WORLD_WEB_POS[idx].y;
  return y0 + (SPIDER_TARGET_Y - y0) * Math.max(0, Math.min(1, done / QUESTIONS_PER_STAGE));
}
function syncWorldSpiders(speaking = true) {
  if (!state || $("#screen-game").hidden) return;
  const idx = activeStageIdx();
  document.querySelectorAll(".resident-spider").forEach((node, i) => {
    node.classList.remove("active", "complete", "shake"); node.style.opacity = "1";
    if (state.completedStages.includes(i)) node.classList.add("complete");
  });
  const drop = $("#drop-spider"); drop.style.opacity = "0"; drop.classList.remove("speaking", "shake", "joy", "touch-cert");
  const cert = $("#certificate-target-world"); cert.classList.remove("show", "pulse");
  const line = $("#drop-silk-line"); if (line) { line.style.opacity="0"; line.style.strokeDashoffset="1"; }
  if (idx < 0 || idx >= STAGES.length) return;
  const resident = $("#resident-" + idx), prog = scoredProgressInStage(idx), pos = WORLD_WEB_POS[idx];
  updateStageDots(idx);
  if (prog.done <= 0) { if (speaking) resident.classList.add("active"); return; }
  resident.style.opacity = "0"; setSilk(idx, prog.done);
  drop.src = CONFIG.media.spiders[STAGES[idx].guide].front; drop.style.left = pos.x + "%"; drop.style.top = spiderY(idx, prog.done) + "%"; drop.style.opacity = "1";
  if (speaking) drop.classList.add("speaking");
}
function animateCorrectDescent() {
  if (!state || state.replay !== null) return;
  const idx = activeStageIdx();
  if (idx < 0 || idx >= STAGES.length) return;
  const pos = WORLD_WEB_POS[idx];
  const prog = scoredProgressInStage(idx);
  const drop = $("#drop-spider");
  const resident = $("#resident-" + idx);
  const prev = Math.max(0, prog.done - 1);

  resident.style.opacity = "0";
  resident.classList.remove("active");
  drop.src = CONFIG.media.spiders[STAGES[idx].guide].front;
  drop.style.left = pos.x + "%";
  drop.style.top = spiderY(idx, prev) + "%";
  drop.style.opacity = "1";
  drop.classList.remove("speaking", "joy", "touch-cert", "descending");

  /* 1) Önce örümcek aşağıya doğru ipek ağını atar. */

function clearRecordDragState() {
  document.querySelectorAll('.slot.drag-over').forEach(x => x.classList.remove('drag-over'));
  document.querySelectorAll('.chip.dragging').forEach(x => x.classList.remove('dragging'));
  document.querySelectorAll('.record-drag-ghost').forEach(x => x.remove());
}

function setupRecordChipDrag(b, c) {
  b.setAttribute("draggable", "true");
  b.addEventListener("dragstart", e => {
    if (!state.task || state.task.done) { e.preventDefault(); return; }
    clearRecordDragState();
    b.classList.add("dragging");
    if (e.dataTransfer) {
      e.dataTransfer.effectAllowed = "move";
      e.dataTransfer.setData("text/plain", c.id);
    }
  });
  b.addEventListener("dragend", clearRecordDragState);

  let pd = null;
  const cleanup = () => {
    if (pd && pd.ghost) pd.ghost.remove();
    document.querySelectorAll('.slot.drag-over').forEach(x => x.classList.remove('drag-over'));
    b.classList.remove('dragging');
    pd = null;
  };
  b.addEventListener("pointerdown", e => {
    if (!state.task || state.task.done || e.button !== 0) return;
    pd = { id: e.pointerId, x: e.clientX, y: e.clientY, active: false, ghost: null };
    try { b.setPointerCapture(e.pointerId); } catch (_) {}
  });
  b.addEventListener("pointermove", e => {
    if (!pd || pd.id !== e.pointerId) return;
    const dist = Math.hypot(e.clientX - pd.x, e.clientY - pd.y);
    if (!pd.active && dist > 8) {
      pd.active = true;
      b.classList.add("dragging");
      const ghost = b.cloneNode(true);
      ghost.classList.remove("dragging");
      ghost.classList.add("record-drag-ghost");
      ghost.removeAttribute("id");
      ghost.setAttribute("aria-hidden", "true");
      document.body.appendChild(ghost);
      pd.ghost = ghost;
    }
    if (!pd.active) return;
    e.preventDefault();
    if (pd.ghost) {
      pd.ghost.style.left = (e.clientX + 14) + "px";
      pd.ghost.style.top = (e.clientY + 14) + "px";
    }
    document.querySelectorAll('.slot.drag-over').forEach(x => x.classList.remove('drag-over'));
    const under = document.elementFromPoint(e.clientX, e.clientY);
    const slot = under && under.closest ? under.closest('.slot') : null;
    if (slot && !slot.classList.contains('correct')) slot.classList.add('drag-over');
  });
  b.addEventListener("pointerup", e => {
    if (!pd || pd.id !== e.pointerId) return;
    if (pd.active) {
      e.preventDefault();
      const under = document.elementFromPoint(e.clientX, e.clientY);
      const slot = under && under.closest ? under.closest('.slot') : null;
      if (slot && !slot.classList.contains('correct')) {
        const sid = slot.dataset.slot;
        const def = state.task.step.slots.find(x => x.id === sid);
        if (def) {
          state.task.selCard = c.id;
          placeCard(def, slot);
          b._suppressClick = true;
          setTimeout(() => { b._suppressClick = false; }, 80);
        }
      }
    }
    cleanup();
  });
  b.addEventListener("pointercancel", cleanup);
}

function makeChip(c) {
  const b = el("button", { type: "button", class: "chip", "aria-pressed": "false", "data-card": c.id, text: c.text });
  setupRecordChipDrag(b, c);
  b.addEventListener("click", () => {

    if (t.selCard === c.id) { t.selCard = null; return; }
    t.selCard = c.id; b.setAttribute("aria-pressed", "true");
    announce("“" + c.text + "” kartı seçildi. Şimdi yerleştireceğin satırı seç.");

}

function onCorrect(step, extraMsg) {
  const t = state.task; t.done = true;
  const attempts = t.wrong + 1;
  const pts = recordResult(step, true, attempts, t.wrong);
  const praise = ["Tebrikler " + state.student.first + "!", "Harika gidiyorsun " + state.student.first + "!", "Çok güzel " + state.student.first + "!", "Aferin " + state.student.first + "!"][Math.floor(Math.random() * 4)];
  setFeedback("ok", "✓ Doğru cevap. " + praise, (extraMsg ? extraMsg + " " : "") + step.explanation, pts);
  Sound.effect("correct");
  Sound.say("Doğru cevap. " + praise + " " + step.explanation);
  announce("Doğru cevap. " + (pts ? pts + " puan kazandın. " : "") + step.explanation, true);
  updateHud(); renderTree();
  animateCorrectDescent();
  enableNext();
}
function initWrong(step) { return (state.replay === null && !state.results[step.id] && state.pendingWrong[step.id]) || 0; }
function onWrong(step, specific) {
  const t = state.task; t.wrong++;
  if (state.replay === null) state.pendingWrong[step.id] = t.wrong;
  const left = t.maxTries - t.wrong;
  Sound.effect("wrong");
  shakeWorldSpider();
  updateHud();
  if (left > 0) {
    const hint = (step.hints && (step.hints[t.wrong - 1] || step.hints[step.hints.length - 1])) || "İpucuna dikkat ederek tekrar düşün.";
    setFeedback("hint", "Henüz değil. " + left + " hakkın kaldı.", (specific ? specific + " " : "") + "İpucu: " + hint);
    Sound.say("Henüz değil. Bir kez daha deneyebilirsin " + state.student.first + ". İpucu: " + hint);
    announce("Yanlış cevap. " + left + " hakkın kaldı. İpucu: " + hint, true);
    return false;
  }
  t.done = true;
  recordResult(step, false, t.wrong, t.wrong);
  setFeedback("info", "Hakların bitti, ama öğrenmeye devam! Doğru cevabı birlikte inceleyelim.", step.explanation);
  Sound.say("Hakların bitti. Doğru cevabı birlikte inceleyelim. " + step.explanation);
  announce("Hakların bitti. " + step.explanation, true);
  renderTree();
  enableNext();
  return true;
}

function checkMCQ(btn, id, grid) {
  const t = state.task; if (t.done) return;
  const step = t.step;
  if (id === step.correct) {
    btn.classList.add("correct"); btn.querySelector(".state").textContent = "✓ Doğru";
    grid.querySelectorAll(".opt").forEach(b => b.disabled = true);
    onCorrect(step);
  } else {
    btn.classList.add("wrong"); btn.querySelector(".state").textContent = "✗ Yanlış"; btn.disabled = true;
    const over = onWrong(step);
    if (over) {
      grid.querySelectorAll(".opt").forEach(b => {
        b.disabled = true;
        if (b.dataset.id === step.correct) { b.classList.add("correct"); b.querySelector(".state").textContent = "✓ Doğru cevap"; }
      });
    }
  }
}

function checkTF(btn, val, row) {
  const t = state.task; if (t.done) return;
  const step = t.step;
  if (val === step.answer) {
    btn.classList.add("correct");
    row.querySelectorAll("button").forEach(b => b.disabled = true);
    onCorrect(step);
  } else {
    btn.classList.add("wrong"); btn.disabled = true;
    btn.append(el("span", { class: "sr-only", text: " (yanlış seçildi)" }));
    const over = onWrong(step);
    if (over) {
      row.querySelectorAll("button").forEach(b => {
        b.disabled = true;
        if (b.dataset.val === String(step.answer)) b.classList.add("correct");
      });
    }
  }
}

function checkMulti(grid) {
  const t = state.task; if (t.done) return;
  const step = t.step;
  const sel = [...grid.querySelectorAll('.card-btn[aria-pressed="true"]')].map(b => b.dataset.id);
  if (!sel.length) { setFeedback("hint", "Önce en az bir kart seçmelisin.", ""); announce("Önce en az bir kart seçmelisin."); return; }
  const correctSet = new Set(step.correct);
  const good = sel.filter(id => correctSet.has(id)).length;
  const bad = sel.length - good;
  if (bad === 0 && good === correctSet.size) {
    grid.querySelectorAll(".card-btn").forEach(b => { b.disabled = true; if (correctSet.has(b.dataset.id)) b.classList.add("correct"); });
    $("#check-btn").disabled = true;
    onCorrect(step);
  } else {
    const specific = bad > 0 ? "Seçtiklerin arasında güvenilir olmayan bir kaynak var." : "Doğru seçimler yaptın ama eksik olanlar var.";
    const over = onWrong(step, specific);
    if (over) {
      $("#check-btn").disabled = true;
      grid.querySelectorAll(".card-btn").forEach(b => {
        b.disabled = true;
        b.setAttribute("aria-pressed", correctSet.has(b.dataset.id) ? "true" : "false");
        if (correctSet.has(b.dataset.id)) b.classList.add("correct");
      });
    }
  }
}

function selectMatch(btn, side) {
  const t = state.task; if (t.done || btn.classList.contains("paired")) return;
  const key = side === "L" ? "selLeft" : "selRight";
  document.querySelectorAll('.m-item[data-side="' + side + '"]').forEach(b => { if (!b.classList.contains("paired")) b.setAttribute("aria-pressed", "false"); });
  if (t[key] === btn) { t[key] = null; return; }
  t[key] = btn; btn.setAttribute("aria-pressed", "true");
  Sound.effect("click");
  if (t.selLeft && t.selRight) {
    const L = t.selLeft, R = t.selRight; t.selLeft = t.selRight = null;
    if (L.dataset.id === R.dataset.id) {
      [L, R].forEach(b => { b.classList.add("paired"); b.setAttribute("aria-pressed", "false"); b.setAttribute("aria-disabled", "true"); });
      t.paired++;
      announce("Eşleşti: " + L.textContent + " – " + R.textContent);
      Sound.say(L.textContent + ". " + R.textContent);
      if (t.paired === t.step.pairs.length) onCorrect(t.step);
      else setFeedback("ok", "✓ Doğru eşleştirme!", "Devam et, " + (t.step.pairs.length - t.paired) + " eşleştirme kaldı.");
    } else {
      [L, R].forEach(b => { b.setAttribute("aria-pressed", "false"); b.classList.add("shake"); setTimeout(() => b.classList.remove("shake"), 400); });
      const over = onWrong(t.step, "Bu iki kart eşleşmiyor.");
      if (over) {
        document.querySelectorAll(".m-item").forEach(b => { if (!b.classList.contains("paired")) { b.classList.add("paired"); } b.setAttribute("aria-disabled", "true"); });
        // Doğru eşleşmeleri göster: sağ sütunu sol sütun sırasına diz
        const lefts = [...document.querySelectorAll('.m-item[data-side="L"]')];
        const rcol = document.querySelector('.m-item[data-side="R"]').parentElement;
        lefts.forEach(l => rcol.append(rcol.querySelector('.m-item[data-id="' + l.dataset.id + '"]')));
      }
    }
  }
}

function placeCard(slotDef, slotBtn) {
  const t = state.task; if (t.done || slotBtn.classList.contains("correct")) return;
  const step = t.step;
  // Doluysa ve kart seçili değilse: kartı havuza geri gönder
  if (t.placed[slotDef.id] && !t.selCard) { returnCard(slotDef.id); return; }
  if (!t.selCard) { announce("Önce sağdaki bilgi kartlarından birini seç."); setFeedback("hint", "Önce bir bilgi kartı seç.", "Sonra bu satıra bas."); return; }
  if (t.placed[slotDef.id]) returnCard(slotDef.id);
  const card = step.cards.find(c => c.id === t.selCard);
  t.placed[slotDef.id] = card.id;
  const chip = document.querySelector('#card-pool .chip[data-card="' + card.id + '"]'); if (chip) chip.remove();
  slotBtn.textContent = card.text; slotBtn.classList.add("filled");
  slotBtn.setAttribute("aria-label", slotDef.label + ": " + card.text + ". Geri almak için basın.");
  t.selCard = null;
  clearFeedback();
  Sound.effect("click");
  announce("“" + card.text + "” kartı “" + slotDef.label + "” satırına yerleştirildi.");
  $("#check-btn").disabled = Object.keys(t.placed).length < step.slots.length;
}
function returnCard(slotId) {
  const t = state.task; const step = t.step;
  const cid = t.placed[slotId]; if (!cid) return;
  delete t.placed[slotId];
  const card = step.cards.find(c => c.id === cid);
  $("#card-pool").append(makeChip(card));
  const slotBtn = $("#slot-" + slotId); const def = step.slots.find(s => s.id === slotId);
  slotBtn.textContent = ""; slotBtn.append(el("span", { class: "ph", text: "Buraya bırak" }));
  slotBtn.classList.remove("filled");
  slotBtn.setAttribute("aria-label", def.label + ": boş. Seçili kartı buraya yerleştirmek için basın.");
  $("#check-btn").disabled = true;
}
function checkRecord() {
  const t = state.task; if (t.done) return;
  const step = t.step;
  let wrongSlots = [];
  step.slots.forEach(s => {
    const btn = $("#slot-" + s.id);
    if (t.placed[s.id] === s.answer) { btn.classList.add("correct"); btn.classList.remove("filled"); btn.setAttribute("aria-label", s.label + ": " + btn.textContent + ". Doğru."); }
    else wrongSlots.push(s.id);
  });
  if (!wrongSlots.length) { $("#check-btn").disabled = true; onCorrect(step); return; }
  wrongSlots.forEach(id => returnCard(id));
  const over = onWrong(step, wrongSlots.length + " kart yanlış yerdeydi ve geri döndü. Doğru olanlar yerinde kaldı.");
  if (over) {
    step.slots.forEach(s => {
      const btn = $("#slot-" + s.id);
      const card = step.cards.find(c => c.id === s.answer);
      const chip = document.querySelector('#card-pool .chip[data-card="' + card.id + '"]'); if (chip) chip.remove();
      btn.textContent = card.text; btn.classList.remove("filled"); btn.classList.add("correct");
    });
    $("#check-btn").disabled = true;
  }
}

function nextStep() {
  Sound.stopRecitation();
  const stage = currentStage();
  if (state.stepIdx < stage.steps.length - 1) { state.stepIdx++; renderStep(); return; }
  // Bölüm bitti
  const idx = activeStageIdx();
  if (state.replay !== null) {
    state.replay = null;
    state.stepIdx = state.savedStepIdx || 0;
    showModal({
      title: "Tekrar tamamlandı!",
      body: [el("p", { text: "Aferin " + state.student.first + "! Kaldığın yerden devam ediyorsun." })],
      buttons: [["Devam Et", "btnContinue", () => { closeModal(); resumeFlow(); }]]
    });
    return;
  }
  if (!state.completedStages.includes(idx)) state.completedStages.push(idx);
  Sound.effect("complete");
  renderTree(idx);
  syncWorldSpiders(false);
  const s = STAGES[idx];
  const stageResults = s.steps.filter(isScored).map(st => state.results[st.id]).filter(Boolean);
  const pts = stageResults.reduce((a, r) => a + r.points, 0);
  const max = s.steps.filter(isScored).reduce((a, st) => a + pointsFor(st.type, 1), 0);
  const starCount = pts >= max * 0.85 ? 3 : pts >= max * 0.5 ? 2 : 1;
  const isLast = idx === STAGES.length - 1;
  const msg = "Tebrikler " + state.student.first + "! " + (idx + 1) + ". ağ tamamlandı. " + CONFIG.media.spiders[s.guide].name + " ağına yerleşti.";
  const openStageComplete = () => {
    if (isLast) {
      showModal({
        title: "5. Ağ Tamamlandı!",
        body: [
          el("div", { class: "celebrate", "aria-hidden": "true" }, webImg(4, { class: "web", alt: "" }), spiderImg(s.guide, "front", { class: "sp" })),
          el("p", { class: "stars", "aria-label": starCount + " yıldız", text: "★".repeat(starCount) + "☆".repeat(3 - starCount) }),
          el("p", { text: "Tebrikler " + state.student.first + "! Beş bilgi ağı tamamlandı." }),
          el("p", { text: "Şimdi 6. Ağ açıldı: Ağı Renklendir. Kendi bilgi ağını renklerle tamamlayabilirsin." })
        ],
        buttons: [["🎨 Ağı Renklendir", "btnContinue", () => {
          closeModal();
          state.stageIdx = STAGES.length;
          Sound.effect("stage");
          renderColoring();
        }]]
      });
      announce("Beşinci ağ tamamlandı. Altıncı ağ, Ağı Renklendir bölümü açıldı.", true);
      return;
    }
    showModal({
      title: (idx + 1) + ". Ağ Tamamlandı!",
      body: [
        el("div", { class: "celebrate", "aria-hidden": "true" }, webImg(4, { class: "web", alt: "" }), spiderImg(s.guide, "front", { class: "sp" })),
        el("p", { class: "stars", "aria-label": starCount + " yıldız", text: "★".repeat(starCount) + "☆".repeat(3 - starCount) }),
        el("p", { text: msg }),
        el("p", { text: "Bu bölümde " + pts + " / " + max + " puan topladın. Şimdi sıradaki örümceğe geçiyoruz." })
      ],
      buttons: [["İleri – sonraki ağ", "btnNext", () => { closeModal(); state.stageIdx++; state.stepIdx = 0; renderStep(); syncWorldSpiders(true); }]]
    });
    Sound.say(msg); announce(msg, true);
  };
  joyAtStageEnd(idx, isLast, openStageComplete);

/** Örümcek ağı SVG'si (8 ışın × 4 halka). interactive=false ise yazdırma için boş/boyalı kopya. */
function buildWebSVG(interactive, onPaint) {
  const NS = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(NS, "svg");
  svg.setAttribute("viewBox", "-210 -210 420 420");
  svg.setAttribute("role", interactive ? "group" : "img");
  svg.setAttribute("aria-label", "Boyanabilir örümcek ağı. Ortada el-Velî, çevresinde Allah'ın güzel isimleri yazılı.");
  const spokes = 8, rings = [38, 80, 125, 170];
  const names = ["er-Rahmân", "er-Rahîm", "el-Hâlık", "el-Musavvir", "en-Nasîr", "el-Mevlâ", "el-Latîf", "el-Hafîz"];
  const pt = (r, i) => { const a = (i / spokes) * Math.PI * 2 - Math.PI / 2; return [(r * Math.cos(a)).toFixed(1), (r * Math.sin(a)).toFixed(1)]; };
  // Hücreler: halkalar arası çokgen parçalar
  let prev = 0;
  rings.forEach((r, ri) => {
    for (let i = 0; i < spokes; i++) {
      const k = ri + "-" + i;
      const p = document.createElementNS(NS, "path");
      const a1 = pt(prev, i), a2 = pt(prev, i + 1), b2 = pt(r, i + 1), b1 = pt(r, i);
      p.setAttribute("d", prev === 0 ? `M0,0 L${b1} L${b2} Z` : `M${a1} L${a2} L${b2} L${b1} Z`);
      p.setAttribute("class", "cell");
      p.setAttribute("fill", state.coloring[k] || "#fffdf5");
      p.dataset.k = k;
      if (interactive) {
        p.setAttribute("tabindex", "0");
        p.setAttribute("role", "button");
        p.setAttribute("aria-label", (ri + 1) + ". halka, " + (i + 1) + ". parça");
        p.addEventListener("click", () => onPaint(p));
        p.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); onPaint(p); } });
      }
      svg.append(p);
    }
    prev = r;
  });
  // Ağ ipleri (dekoratif)
  const g = document.createElementNS(NS, "g"); g.setAttribute("stroke", "#5b3a1b"); g.setAttribute("stroke-width", "2.2"); g.setAttribute("fill", "none"); g.setAttribute("pointer-events", "none");
  for (let i = 0; i < spokes; i++) { const l = document.createElementNS(NS, "line"); const e = pt(rings[3] + 20, i); l.setAttribute("x1", 0); l.setAttribute("y1", 0); l.setAttribute("x2", e[0]); l.setAttribute("y2", e[1]); g.append(l); }
  svg.append(g);
  // Yazılar
  const t0 = document.createElementNS(NS, "text"); t0.setAttribute("x", 0); t0.setAttribute("y", 6); t0.setAttribute("text-anchor", "middle"); t0.setAttribute("font-size", "17"); t0.textContent = "el-Velî"; svg.append(t0);
  names.forEach((n, i) => {
    const a = ((i + 0.5) / spokes) * Math.PI * 2 - Math.PI / 2, r = 148;
    const t = document.createElementNS(NS, "text");
    t.setAttribute("x", (r * Math.cos(a)).toFixed(1)); t.setAttribute("y", (r * Math.sin(a) + 4).toFixed(1));
    t.setAttribute("text-anchor", "middle"); t.setAttribute("font-size", "12.5"); t.textContent = n; svg.append(t);
  });

document.addEventListener("keydown", (e) => {
  const bd = $("#modal-backdrop");
  if (bd.hidden) return;
  if (e.key === "Escape") {
    const btns = $("#modal").querySelectorAll("button");
    if (btns.length > 1) { e.preventDefault(); closeModal(); }   // tek butonlu (bölüm sonu) pencerede Esc akışı bozmasın
    return;
  }
  if (e.key !== "Tab") return;
  const f = [...$("#modal").querySelectorAll("button,a,[tabindex]:not([tabindex='-1'])")].filter(x => !x.disabled);
  if (!f.length) return;
  const first = f[0], last = f[f.length - 1];
  if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
});

let v7FitRaf = 0;

  const main = document.getElementById('main');
  if (main && !main.querySelector(':scope > .stage-panel-inner')) {
    const inner = document.createElement('div'); inner.className = 'stage-panel-inner';
    while(main.firstChild) inner.appendChild(main.firstChild);

function fitV7Panel(){
  const main=document.getElementById('main'), inner=main&&main.querySelector('.stage-panel-inner');
  if(!main||!inner||main.hidden) return;
  inner.style.transform='none'; inner.style.width='100%';
  const avail=Math.max(300,main.clientHeight-6); let natural=Math.max(1,inner.scrollHeight);
  let scale=Math.min(1,avail/natural); scale=Math.max(.58,scale);
  inner.style.width=(100/scale)+'%';
  natural=Math.max(1,inner.scrollHeight); scale=Math.min(1,avail/natural); scale=Math.max(.58,scale);

function v7Hint(step){

  if(!hs.length){ setFeedback('hint','İpucu','Bu görev için ek ipucu bulunmuyor.'); requestV7Fit(); return; }
  const n=t ? (t.v7HintIndex||0) : 0; const text=hs[Math.min(n,hs.length-1)];
  if(t) t.v7HintIndex=Math.min(n+1,hs.length-1);

/* Sertifika hedefi: tüm örümcekler her doğru cevapta bu noktaya yaklaşır. */
const V7_CERT_POINT={x:32.3,y:75.7};
function v7SpiderPoint(idx,done){
  const start=WORLD_WEB_POS[idx]; const t=Math.max(0,Math.min(1,done/QUESTIONS_PER_STAGE));
  return {x:start.x+(V7_CERT_POINT.x-start.x)*t,y:start.y+(V7_CERT_POINT.y-start.y)*t};
}
function setSilk(idx,done){
  const start=WORLD_WEB_POS[idx], end=v7SpiderPoint(idx,done), line=document.getElementById('drop-silk-line'); if(!line)return;
  line.classList.remove('casting'); line.setAttribute('x1',String(start.x)); line.setAttribute('y1',String(start.y)); line.setAttribute('x2',String(end.x)); line.setAttribute('y2',String(end.y));
  line.style.opacity=done>0?'1':'0'; line.style.strokeDashoffset=done>0?'0':'1';
}
function castSilkToStep(idx,nextDone){
  const start=WORLD_WEB_POS[idx], end=v7SpiderPoint(idx,nextDone), line=document.getElementById('drop-silk-line'); if(!line)return;
  line.classList.remove('casting'); line.setAttribute('x1',String(start.x)); line.setAttribute('y1',String(start.y)); line.setAttribute('x2',String(end.x)); line.setAttribute('y2',String(end.y));

function syncWorldSpiders(speaking=true){
  if(!state||document.getElementById('screen-game').hidden)return; const idx=activeStageIdx();
  document.querySelectorAll('.resident-spider').forEach((node,i)=>{node.classList.remove('active','complete','shake');node.style.opacity='1';if(state.completedStages.includes(i))node.classList.add('complete');});
  const drop=document.getElementById('drop-spider'); drop.style.opacity='0';drop.classList.remove('speaking','shake','joy','touch-cert');

  resident.style.opacity='0';setSilk(idx,prog.done);const pt=v7SpiderPoint(idx,prog.done);drop.src=CONFIG.media.spiders[STAGES[idx].guide].front;drop.style.left=pt.x+'%';drop.style.top=pt.y+'%';drop.style.opacity='1';if(speaking)drop.classList.add('speaking');

function animateCorrectDescent(){
  if(!state||state.replay!==null)return; const idx=activeStageIdx(); if(idx<0||idx>=STAGES.length)return;
  const prog=scoredProgressInStage(idx), prev=Math.max(0,prog.done-1), startPt=v7SpiderPoint(idx,prev), endPt=v7SpiderPoint(idx,prog.done), drop=document.getElementById('drop-spider'), resident=document.getElementById('resident-'+idx);
  resident.style.opacity='0';resident.classList.remove('active');drop.src=CONFIG.media.spiders[STAGES[idx].guide].front;drop.style.left=startPt.x+'%';drop.style.top=startPt.y+'%';drop.style.opacity='1';drop.classList.remove('speaking','joy','touch-cert','descending');
  castSilkToStep(idx,prog.done);drop.classList.add('web-cast');
  setTimeout(()=>{drop.classList.remove('web-cast');drop.classList.add('descending');drop.style.left=endPt.x+'%';drop.style.top=endPt.y+'%';},260);
  setTimeout(()=>{drop.classList.remove('descending');drop.classList.add('speaking');setSilk(idx,prog.done);updateStageDots(idx);requestV7Fit();},980);
}
function joyAtStageEnd(idx,final=false,done){
  const prog=scoredProgressInStage(idx), drop=document.getElementById('drop-spider'); if(prog.done<=0){if(done)done();return;}
  const pt=v7SpiderPoint(idx,prog.done);drop.classList.remove('speaking','joy','touch-cert');drop.style.opacity='1';drop.style.left=pt.x+'%';drop.style.top=pt.y+'%';void drop.offsetWidth;drop.classList.add('joy');

<script id="v24-layout-guard">
(function(){
  function inCanvas(rect){
    return rect.left >= -2 && rect.top >= -2 && rect.right <= 1922 && rect.bottom <= 1082;
  }
  function keepInteractiveInside(){
    const root=document.getElementById('game-canvas')||document.body;
    const nodes=[...document.querySelectorAll('button,input,textarea,select,.stage-panel,.stage-list,#certificate-target-world,.result-actions')];
    nodes.forEach(n=>{
      if(!n || n.offsetParent===null) return;
      const r=n.getBoundingClientRect();
      if(!inCanvas(r)) n.dataset.layoutWarning='overflow';
      else delete n.dataset.layoutWarning;
    });
  }
  window.v24CheckLayout=keepInteractiveInside;
  window.addEventListener('resize',()=>requestAnimationFrame(keepInteractiveInside));
  document.addEventListener('DOMContentLoaded',()=>{setTimeout(keepInteractiveInside,120);setTimeout(keepInteractiveInside,600)});
  document.addEventListener('click',()=>setTimeout(keepInteractiveInside,120),true);
})();
</script>
